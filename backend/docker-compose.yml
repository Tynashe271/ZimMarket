name: zimmarket-backend
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zimmarket
      POSTGRES_PASSWORD: zimmarket
      POSTGRES_DB: zimmarket
    ports: ["5435:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zimmarket"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  redis_data:
