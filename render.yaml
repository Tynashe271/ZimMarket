databases:
  - name: zimmarket-postgres
    plan: free
    databaseName: zimmarket
    user: zimmarket

services:
  - name: zimmarket-redis
    type: keyvalue
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all (free-tier job queue, no sensitive data)

  - name: zimmarket-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zimmarket-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: zimmarket-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_TTL_DAYS
        value: "30"
      - key: CORS_ORIGINS
        value: https://zimmarket-frontend.onrender.com
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: STORAGE_SIGNING_SECRET
        generateValue: true
      - key: APP_PUBLIC_URL
        value: https://zimmarket-frontend.onrender.com
      - key: API_PUBLIC_URL
        value: https://zimmarket-backend.onrender.com/api/v1
      - key: PAYMENT_PROVIDER
        value: development
      - key: PAYNOW_FALLBACK_EMAIL
        value: payments@zimmarket.local
      - key: WHATSAPP_PROVIDER
        value: development
      - key: SMS_PROVIDER
        value: development
      - key: EMAIL_PROVIDER
        value: development
      - key: MALWARE_SCANNER
        value: development
      - key: MAPS_PROVIDER
        value: development
      - key: ACCOUNTING_PROVIDER
        value: internal
      - key: LOCAL_STORAGE_PATH
        value: .data/storage
      - key: ZIMRA_API_ENABLED
        value: "false"
      - key: ZIMRA_API_URL
        value: https://api.zimra.co.zw
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  - name: zimmarket-frontend
    type: web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: BACKEND_URL
        value: https://zimmarket-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: ""
